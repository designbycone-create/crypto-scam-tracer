<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scam Network · ScamHunter Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.51.3/dist/force-graph.min.js"></script>
<style>
:root{
  --bg0:#05070d; --bg1:#0a0f1c; --glass:rgba(14,19,33,.72); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#e9edf7; --mut:#8a93ab; --dim:#5b637a;
  --root:#ff2e63; --hub:#ffb020; --wallet:#8b95b0; --exchange:#3da9ff; --swap:#b46cff; --victim:#2ee6a8; --you:#ff4d6d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--fg);font:13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(1200px 800px at 70% 20%,rgba(61,169,255,.10),transparent 60%),
             radial-gradient(900px 700px at 15% 85%,rgba(255,46,99,.08),transparent 60%),
             radial-gradient(1400px 900px at 50% 50%,#0b1222 0%,#05070d 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
#graph{position:fixed;inset:0;z-index:1}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
/* top bar */
#top{position:fixed;top:14px;left:14px;right:14px;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:conic-gradient(from 210deg,var(--root),var(--swap),var(--exchange),var(--victim),var(--root));box-shadow:0 0 18px rgba(255,46,99,.45)}
.brand .logo::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg0)}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:.3px}
.back{color:var(--mut);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
.back:hover{color:var(--fg);border-color:var(--line2)}
.stats{display:flex;gap:8px;margin-left:auto;overflow:hidden}
.stat{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);white-space:nowrap}
.stat b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.stat.you b{color:var(--you)}
#search{width:240px;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:var(--fg);padding:9px 12px;border-radius:12px;font:inherit;outline:none}
#search:focus{border-color:rgba(61,169,255,.6);box-shadow:0 0 0 3px rgba(61,169,255,.15)}
/* left HUD */
#hud{position:fixed;top:104px;left:14px;width:258px;z-index:5;padding:14px;max-height:calc(100vh - 210px);overflow:auto}
h4{margin:2px 0 8px;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.chip{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;cursor:pointer;user-select:none;border:1px solid transparent;transition:.15s}
.chip:hover{background:rgba(255,255,255,.04)}
.chip.off{opacity:.35}
.dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.chip .n{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px 10px;margin:6px 0 0;border-radius:11px;cursor:pointer;
  border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--fg);font:600 12.5px Inter,sans-serif;transition:.15s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.primary{background:linear-gradient(135deg,rgba(255,77,109,.9),rgba(255,46,99,.75));border-color:transparent;box-shadow:0 6px 22px rgba(255,46,99,.35)}
.btn.primary:hover{filter:brightness(1.1)}
.sep{height:1px;background:var(--line);margin:12px 0}
.grp{padding:7px 9px;border-radius:10px;cursor:pointer;display:flex;gap:9px;align-items:center}
.grp:hover{background:rgba(255,255,255,.05)}
.grp i{width:10px;height:10px;border-radius:3px;flex:none}
.grp .n{margin-left:auto;color:var(--mut);font-size:12px}
.mut{color:var(--mut)} .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;word-break:break-all}
/* inspector */
#insp{position:fixed;top:104px;right:14px;width:340px;z-index:5;padding:16px;max-height:calc(100vh - 210px);overflow:auto;
  transform:translateX(380px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
#insp.on{transform:none;opacity:1}
#insp .x{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--mut);font-size:18px}
.kind{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line2)}
.ttl{font-size:19px;font-weight:800;margin:10px 0 4px;line-height:1.25}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv div{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.links a{color:#7cc4ff;text-decoration:none;margin-right:12px;font-weight:600;font-size:12px}
.links a:hover{text-decoration:underline}
.ev{margin:6px 0 0;padding-left:16px} .ev li{margin:3px 0;color:#c7cde0;font-size:12px}
.dep{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.dep .y{color:var(--you);font-weight:700}
.badge{font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:var(--you);color:#fff;margin-left:6px}
/* timeline */
#tl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;width:min(860px,calc(100vw - 28px));padding:12px 16px;display:flex;align-items:center;gap:14px}
#play{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;flex:none;color:#fff;font-size:15px;
  background:linear-gradient(135deg,var(--exchange),var(--swap));box-shadow:0 6px 22px rgba(61,169,255,.35)}
#range{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;outline:none;
  background:linear-gradient(90deg,var(--exchange) var(--p,100%),rgba(255,255,255,.1) var(--p,100%))}
#range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(61,169,255,.3),0 0 18px rgba(61,169,255,.8);cursor:pointer}
#range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 18px rgba(61,169,255,.8)}
#when{min-width:190px;text-align:right}
#when b{display:block;font-variant-numeric:tabular-nums}
#when span{font-size:11px;color:var(--mut)}
#ticker{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:5;pointer-events:none;font-size:12px;color:#cfd6ea;
  padding:6px 12px;border-radius:999px;background:rgba(10,15,28,.6);border:1px solid var(--line);opacity:0;transition:opacity .3s}
#tip{position:fixed;z-index:6;pointer-events:none;padding:8px 10px;font-size:12px;border-radius:10px;opacity:0;transition:opacity .12s;max-width:280px}
@media (max-width:1100px){.stats .stat:nth-child(n+3){display:none}#search{width:170px}}
@media (max-width:760px){#hud{display:none}.stats{display:none}#insp{left:14px;right:14px;width:auto;top:auto;bottom:96px;max-height:45vh}#when{min-width:120px}}
</style></head>
<body>
<div id="graph"></div>

<div id="top" class="glass">
  <a class="back" href="/">&larr; Desk</a>
  <div class="brand"><div class="logo"></div><div>Scam Network<small>live evidence map · public blockchain data</small></div></div>
  <div class="stats" id="stats"></div>
  <input id="search" placeholder="Search address, exchange, operator…" autocomplete="off">
</div>

<div id="hud" class="glass">
  <h4>Show</h4><div id="legend"></div>
  <button class="btn primary" id="mine">&#9673; Follow my stolen funds</button>
  <button class="btn" id="reset">Reset view</button>
  <div class="sep"></div>
  <h4>Operator groups</h4>
  <div id="groups"></div>
  <div class="sep"></div>
  <div class="mut" style="font-size:11.5px">Glowing particles are money moving. Red paths are <b style="color:var(--you)">your</b> funds. Halos group wallets one operator controls. Click anything.</div>
</div>

<div id="insp" class="glass"><span class="x" id="close">&times;</span><div id="inspBody"></div></div>
<div id="ticker"></div>
<div id="tip" class="glass"></div>

<div id="tl" class="glass">
  <button id="play" title="Replay the money flow">&#9654;</button>
  <input id="range" type="range" min="0" max="1000" value="1000">
  <div id="when"><b id="whenT">All time</b><span id="whenS">drag or press play to replay</span></div>
</div>

<script>
const D = __GRAPH_DATA__;
const COL = {root:'#ff2e63',hub:'#ffb020',wallet:'#8b95b0',exchange:'#3da9ff',swap:'#b46cff',victim:'#2ee6a8'};
const NAME = {root:'Scam wallet',hub:'Laundering hub',wallet:'Network wallet',exchange:'Exchange / cash-out',swap:'Swap / bridge',victim:'Victim source'};
const GCOL = ['#ff7ab6','#7cf5ff','#ffd166','#a78bfa','#5eead4','#fb923c','#f472b6','#60a5fa','#facc15','#34d399'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString(undefined,{maximumFractionDigits: n < 100 ? 2 : 0});
const short = a => a ? a.slice(0,6) + '…' + a.slice(-4) : '';
const groupColor = {}; D.groups.forEach((g,i) => groupColor[g.id] = GCOL[i % GCOL.length]);
const byId = {}; D.nodes.forEach(n => byId[n.id] = n);
const nbrs = {}; D.links.forEach(l => { (nbrs[l.source] ||= new Set()).add(l.target); (nbrs[l.target] ||= new Set()).add(l.source); });

// ---------- stats ----------
const S = D.stats;
document.getElementById('stats').innerHTML = [
  ['Wallets mapped', S.wallets, ''], ['Cash-out points', S.cashout_points + (S.mc_cashouts||0), ''],
  ...(S.xrpl ? [['XRP to exchanges', S.to_exchanges, '']] : []),
  ['Chains', S.chains, ''], ['Operator groups', S.operators, ''],
  ...(S.xrpl ? [['XRP cashed out on your funds\' path', S.yours, 'you']] : [])].map(([k,v,c]) =>
  `<div class="stat ${c}"><b data-v="${v}">0</b><span>${k}</span></div>`).join('');
document.querySelectorAll('.stat b').forEach(el => { const v = +el.dataset.v; let t0 = null;
  const step = ts => { t0 ??= ts; const p = Math.min(1,(ts-t0)/1100), e = 1-Math.pow(1-p,3); el.textContent = fmt(Math.round(v*e)); if (p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step); });

// ---------- filters ----------
const on = {root:true,hub:true,wallet:true,exchange:true,swap:true,victim:true};
const counts = {}; D.nodes.forEach(n => counts[n.kind] = (counts[n.kind]||0)+1);
document.getElementById('legend').innerHTML = Object.keys(COL).filter(k => counts[k]).map(k =>
  `<div class="chip" data-k="${k}"><span class="dot" style="color:${COL[k]};background:${COL[k]}"></span>${NAME[k]}<span class="n">${counts[k]}</span></div>`).join('');
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { const k = c.dataset.k; on[k] = !on[k]; c.classList.toggle('off', !on[k]); refresh(); });
document.getElementById('groups').innerHTML = D.groups.length ? D.groups.map(g =>
  `<div class="grp" data-g="${esc(g.id)}"><i style="background:${groupColor[g.id]};box-shadow:0 0 10px ${groupColor[g.id]}"></i>${esc(g.name)}<span class="n">${g.size}</span></div>`).join('')
  : '<div class="mut" style="font-size:12px">None found yet — grouping runs hourly in the background.</div>';
document.querySelectorAll('.grp').forEach(el => el.onclick = () => focusGroup(el.dataset.g));

// ---------- timeline ----------
const times = D.links.map(l => l.t0).filter(Boolean).sort((a,b) => a-b);
const T0 = times[0] || 0, T1 = times[times.length-1] || 0;
let T = Infinity, playing = false;
const range = document.getElementById('range');
const fmtT = t => new Date(t*1000).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
function setT(v) {
  range.style.setProperty('--p', (v/10) + '%');
  if (v >= 1000 || !T0) { T = Infinity; whenT.textContent = 'All time'; whenS.textContent = times.length ? `${fmtT(T0)} → ${fmtT(T1)}` : 'no timestamps'; }
  else { T = T0 + (T1-T0) * v/1000; whenT.textContent = fmtT(T);
    const live = D.links.filter(l => l.t0 && l.t0 <= T).length; whenS.textContent = `${live} of ${D.links.length} flows so far`; }
  refresh();
}
range.oninput = () => { playing = false; play.innerHTML = '&#9654;'; setT(+range.value); };
const play = document.getElementById('play'), whenT = document.getElementById('whenT'), whenS = document.getElementById('whenS'), ticker = document.getElementById('ticker');
let lastTick = 0;
play.onclick = () => {
  playing = !playing; play.innerHTML = playing ? '&#10073;&#10073;' : '&#9654;';
  if (playing && +range.value >= 1000) range.value = 0;
  const loop = ts => { if (!playing) return;
    const v = Math.min(1000, +range.value + 2.2); range.value = v; setT(v);
    if (ts - lastTick > 450) { lastTick = ts; const recent = D.links.filter(l => l.t0 && l.t0 <= T).sort((a,b) => b.t0-a.t0)[0];
      if (recent) { const s = byId[idOf(recent.source)], t = byId[idOf(recent.target)];
        ticker.innerHTML = `<b style="color:${recent.yours?'var(--you)':'#fff'}">${recent.label ? esc(recent.label) : fmt(recent.xrp) + ' XRP'}</b> &nbsp;${esc(s?.name||short(s?.id))} → ${esc(t?.name||short(t?.id))}`; ticker.style.opacity = 1; } }
    if (v >= 1000) { playing = false; play.innerHTML = '&#9654;'; ticker.style.opacity = 0; return; }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
};
const idOf = x => typeof x === 'object' ? x.id : x;

// ---------- focus / selection ----------
let focus = null, selected = null, hover = null;
const visNode = n => on[n.kind] && (T === Infinity || n.kind === 'root' || (n.t && n.t <= T) || (!n.t && T === Infinity));
const visLink = l => { const s = byId[idOf(l.source)], t = byId[idOf(l.target)];
  return s && t && on[s.kind] && on[t.kind] && (T === Infinity || (l.t0 && l.t0 <= T)); };
const dimmed = n => focus && !focus.has(n.id);

// ---------- graph ----------
const el = document.getElementById('graph');
const G = ForceGraph()(el)
  .graphData({nodes: D.nodes, links: D.links})
  .backgroundColor('rgba(0,0,0,0)')
  .nodeId('id').nodeVal(n => n.r).nodeRelSize(1)
  .nodeVisibility(visNode).linkVisibility(visLink)
  .linkCurvature(0.18)
  .linkColor(l => { const d = focus && !(focus.has(idOf(l.source)) && focus.has(idOf(l.target)));
    if (d) return 'rgba(120,140,180,0.03)';
    return l.yours ? 'rgba(255,77,109,0.55)' : 'rgba(140,160,210,0.14)'; })
  .linkWidth(l => (l.yours ? 1.6 : 0.5) + Math.min(2.6, Math.log10(1 + l.xrp) * 0.45))
  .linkDirectionalParticles(l => l.yours ? 5 : Math.max(1, Math.min(4, Math.round(Math.log10(1 + l.xrp)) - 1)))
  .linkDirectionalParticleWidth(l => l.yours ? 3.6 : 2.0)
  .linkDirectionalParticleSpeed(l => 0.0028 + Math.min(0.006, Math.log10(1 + l.xrp) * 0.0009))
  .linkDirectionalParticleColor(l => l.yours ? '#ff6b86' : (COL[byId[idOf(l.source)]?.kind] || '#9fb3ff'))
  .d3VelocityDecay(0.28)
  .cooldownTicks(400)
  .onNodeHover(n => { hover = n; el.style.cursor = n ? 'pointer' : 'grab'; tipShow(n); })
  .onNodeClick(n => select(n))
  .onBackgroundClick(() => { select(null); focus = null; })
  .nodePointerAreaPaint((n, color, ctx) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 4, 0, 2*Math.PI); ctx.fill(); })
  .onRenderFramePre((ctx, scale) => drawHalos(ctx, scale))
  .nodeCanvasObject((n, ctx, scale) => drawNode(n, ctx, scale));
G.d3Force('charge').strength(n => n.kind === 'exchange' ? -140 : -55);
G.d3Force('link').distance(l => 26 + Math.min(70, Math.log10(1 + l.xrp) * 9));
window.addEventListener('resize', () => G.width(innerWidth).height(innerHeight));

function drawNode(n, ctx, scale) {
  const c = COL[n.kind] || '#999', r = n.r, t = performance.now() / 1000;
  if (!isFinite(n.x) || !isFinite(n.y) || !isFinite(r)) return;
  ctx.save();
  ctx.globalAlpha = dimmed(n) ? 0.10 : 1;
  // halo
  const g = ctx.createRadialGradient(n.x, n.y, r * 0.2, n.x, n.y, r * 3.2);
  g.addColorStop(0, c + 'aa'); g.addColorStop(0.35, c + '33'); g.addColorStop(1, c + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, r * 3.2, 0, 2 * Math.PI); ctx.fill();
  // body
  const b = ctx.createRadialGradient(n.x - r * .35, n.y - r * .35, r * .1, n.x, n.y, r);
  b.addColorStop(0, '#ffffff'); b.addColorStop(0.25, c); b.addColorStop(1, shade(c, -0.45));
  ctx.fillStyle = b; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI); ctx.fill();
  // exchange ring
  if (n.kind === 'exchange') { ctx.strokeStyle = c; ctx.lineWidth = 1.2 / scale * 1.5; ctx.beginPath(); ctx.arc(n.x, n.y, r + 2.5, 0, 2 * Math.PI); ctx.stroke(); }
  // scam wallet pulse
  if (n.kind === 'root') { for (let i = 0; i < 2; i++) { const p = ((t * 0.6 + i * 0.5) % 1);
      ctx.strokeStyle = `rgba(255,46,99,${0.55 * (1 - p)})`; ctx.lineWidth = 2 / scale; ctx.beginPath(); ctx.arc(n.x, n.y, r + 2 + p * 26, 0, 2 * Math.PI); ctx.stroke(); } }
  // your funds
  if (n.yours) { ctx.setLineDash([3 / scale, 3 / scale]); ctx.lineDashOffset = -t * 8 / scale; ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 2.2 / scale;
    ctx.beginPath(); ctx.arc(n.x, n.y, r + 6, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]); }
  if (selected === n || hover === n) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 / scale; ctx.beginPath(); ctx.arc(n.x, n.y, r + 4, 0, 2 * Math.PI); ctx.stroke(); }
  // label
  const show = n.name && (scale > 1.4 || n.kind === 'root' || n.yours || (n.kind === 'exchange' && scale > 0.7) || selected === n || hover === n);
  if (show && !dimmed(n)) {
    const fs = Math.max(10, 12) / scale, txt = n.name;
    ctx.font = `600 ${fs}px Inter, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const w = ctx.measureText(txt).width, y = n.y + r + 5 / scale;
    ctx.fillStyle = 'rgba(5,7,13,0.72)'; roundRect(ctx, n.x - w / 2 - 5 / scale, y - 2 / scale, w + 10 / scale, fs + 5 / scale, 5 / scale); ctx.fill();
    ctx.fillStyle = n.yours ? '#ffd0d8' : '#eef2ff'; ctx.fillText(txt, n.x, y);
  }
  ctx.restore();
}
function drawHalos(ctx, scale) {
  for (const g of D.groups) {
    const ms = D.nodes.filter(n => n.group === g.id && isFinite(n.x) && isFinite(n.y) && visNode(n));
    if (ms.length < 2) continue;
    const cx = ms.reduce((s, n) => s + n.x, 0) / ms.length, cy = ms.reduce((s, n) => s + n.y, 0) / ms.length;
    const rad = Math.max(...ms.map(n => Math.hypot(n.x - cx, n.y - cy) + n.r)) + 22;
    if (rad > 220) {   // group spread across the map: tie members together instead of one giant halo
      const c2 = groupColor[g.id]; ctx.save(); ctx.globalAlpha = focus && !ms.some(n => focus.has(n.id)) ? 0.1 : 0.9;
      for (const n of ms) { ctx.strokeStyle = c2; ctx.lineWidth = 2 / scale; ctx.setLineDash([2 / scale, 3 / scale]);
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 9, 0, 2 * Math.PI); ctx.stroke(); }
      ctx.setLineDash([]); ctx.restore(); continue; }
    const c = groupColor[g.id], dim = focus && !ms.some(n => focus.has(n.id));
    ctx.save(); ctx.globalAlpha = dim ? 0.15 : 1;
    const gr = ctx.createRadialGradient(cx, cy, rad * 0.2, cx, cy, rad);
    gr.addColorStop(0, c + '1f'); gr.addColorStop(0.8, c + '14'); gr.addColorStop(1, c + '00');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 2 * Math.PI); ctx.fill();
    ctx.setLineDash([6 / scale, 6 / scale]); ctx.strokeStyle = c + '66'; ctx.lineWidth = 1 / scale;
    ctx.beginPath(); ctx.arc(cx, cy, rad - 4, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
    if (scale > 0.6) { ctx.font = `700 ${11 / scale}px Inter`; ctx.fillStyle = c; ctx.textAlign = 'center'; ctx.fillText(g.id.toUpperCase(), cx, cy - rad - 4 / scale); }
    ctx.restore();
  }
}
function shade(hex, p) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * (1 + p)); g = Math.round(g * (1 + p)); b = Math.round(b * (1 + p));
  return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, '0')).join(''); }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function refresh() { G.nodeVisibility(visNode).linkVisibility(visLink); }

// ---------- tooltip ----------
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => { tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
function tipShow(n) { if (!n) { tip.style.opacity = 0; return; }
  tip.innerHTML = `<b>${esc(n.name || short(n.id))}</b><br><span class="mut">${NAME[n.kind]}${n.chain ? ' · ' + esc(n.chain) : ' · ' + fmt(n.vol) + ' XRP moved'}</span>`; tip.style.opacity = 1; }

// ---------- inspector ----------
const insp = document.getElementById('insp'), body = document.getElementById('inspBody');
document.getElementById('close').onclick = () => select(null);
function select(n) {
  selected = n;
  if (!n) { insp.classList.remove('on'); focus = null; return; }
  focus = new Set([n.id, ...(nbrs[n.id] || [])]);
  G.centerAt(n.x, n.y, 600); if (G.zoom() < 1.6) G.zoom(1.8, 600);
  const c = COL[n.kind], g = n.group && D.groups.find(x => x.id === n.group);
  let h = `<span class="kind" style="color:${c};border-color:${c}55"><span class="dot" style="color:${c};background:${c};width:8px;height:8px"></span>${NAME[n.kind]}</span>
    ${n.yours ? '<span class="badge">YOUR FUNDS</span>' : ''}
    <div class="ttl">${esc(n.name || 'Unlabeled wallet')}</div>
    <div class="mono mut">${esc(n.id)}</div>
    <div class="kv"><div><b>${n.chain ? esc(n.chain) : fmt(n.bal)}</b><span>${n.chain ? 'Chain' : 'Balance XRP'}</span></div><div><b>${fmt(n.vol)}</b><span>${n.chain ? 'Transfers' : 'Moved (this map)'}</span></div>
    <div><b>${(nbrs[n.id] || new Set()).size}</b><span>Counterparties</span></div><div><b>${n.ndeps || 0}</b><span>Deposits in</span></div></div>
    <div class="links">${explorerLinks(n)}</div>`;
  if (n.role) h += `<p class="mut" style="margin:10px 0 0">${esc(n.role)}</p>`;
  if (g) h += `<div class="sep"></div><h4 style="color:${groupColor[g.id]}">${esc(g.name)} · ${g.size} wallets</h4><ul class="ev">` +
    g.links.filter(l => l.a === n.id || l.b === n.id).slice(0, 6).map(l => `<li>${esc(l.why)}: ${esc(l.detail)}</li>`).join('') + '</ul>';
  if (n.att && n.att.name) h += `<div class="sep"></div><h4>Attribution · ${esc(n.att.confidence)}</h4><div style="font-weight:700">${esc(n.att.name)}</div><ul class="ev">` +
    (n.att.evidence || []).map(e => `<li>${esc(e)}</li>`).join('') + '</ul>';
  if (n.deps.length) h += `<div class="sep"></div><h4>Deposits received · tag = customer account</h4>` + n.deps.map(d =>
    `<div class="dep"><span>tag <b>${esc(d.tag)}</b>${d.yours ? ' <span class="y">· yours</span>' : ''}<br><span class="mut">${esc(d.time)}</span></span>
     <span style="text-align:right"><b>${fmt(d.xrp)}</b> XRP<br><a href="https://livenet.xrpl.org/transactions/${d.hash}" target="_blank" style="color:#7cc4ff">tx</a></span></div>`).join('');
  if (n.kind === 'exchange') h += `<button class="btn primary" onclick="location.href='/submit'">Open freeze kit</button>`;
  body.innerHTML = h; insp.classList.add('on');
}
const EXP = {bitcoin:a=>[['mempool.space','https://mempool.space/address/'+a]], tron:a=>[['Tronscan','https://tronscan.org/#/address/'+a]],
  solana:a=>[['Solscan','https://solscan.io/account/'+a]], ethereum:a=>[['Etherscan','https://etherscan.io/address/'+a]],
  bsc:a=>[['BscScan','https://bscscan.com/address/'+a]], polygon:a=>[['PolygonScan','https://polygonscan.com/address/'+a]],
  arbitrum:a=>[['Arbiscan','https://arbiscan.io/address/'+a]], base:a=>[['BaseScan','https://basescan.org/address/'+a]],
  optimism:a=>[['Optimism','https://optimistic.etherscan.io/address/'+a]], avalanche:a=>[['Snowtrace','https://snowtrace.io/address/'+a]]};
function explorerLinks(n){ const a = n.chain ? n.id.slice(n.chain.length+1) : n.id;
  const L = n.chain ? (EXP[n.chain]||(()=>[]))(a) : [['XRPL','https://livenet.xrpl.org/accounts/'+a],['XRPScan','https://xrpscan.com/account/'+a],['Bithomp','https://bithomp.com/explorer/'+a]];
  L.push(['Chainabuse','https://www.chainabuse.com/address/'+a]);
  return L.map(([t,u])=>`<a href="${u}" target="_blank">${t}</a>`).join(''); }
function focusGroup(id) { const ms = D.nodes.filter(n => n.group === id); if (!ms.length) return;
  focus = new Set(ms.flatMap(n => [n.id])); selected = null; insp.classList.remove('on');
  G.zoomToFit(700, 120, n => focus.has(n.id)); }
document.getElementById('mine').onclick = () => {
  const ids = new Set(); D.links.filter(l => l.yours).forEach(l => { ids.add(idOf(l.source)); ids.add(idOf(l.target)); });
  if (D.root) ids.add(D.root);
  if (ids.size < 2) { alertMsg('No traced path for your funds yet.'); return; }
  focus = ids; selected = null; insp.classList.remove('on'); G.zoomToFit(800, 140, n => ids.has(n.id)); };
document.getElementById('reset').onclick = () => { focus = null; select(null); range.value = 1000; setT(1000); G.zoomToFit(800, 90); };
function alertMsg(m) { ticker.textContent = m; ticker.style.opacity = 1; setTimeout(() => ticker.style.opacity = 0, 2200); }

// ---------- search ----------
document.getElementById('search').addEventListener('keydown', e => { if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const g = D.groups.find(x => x.id.toLowerCase() === q || x.name.toLowerCase().includes(q)); if (g) return focusGroup(g.id);
  const n = D.nodes.find(x => x.id.toLowerCase() === q) || D.nodes.find(x => x.id.toLowerCase().includes(q) || (x.name || '').toLowerCase().includes(q));
  n ? select(n) : alertMsg('No match'); });

setT(1000);
setTimeout(() => G.zoomToFit(900, 90), 1600);
</script>
